apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deployd.fullname" . }}
  labels:
    {{- include "deployd.labels" . | nindent 4 }}
spec:
  egress:
  - {} # Allow all egress traffic
  podSelector:
    matchLabels:
      {{ include "deployd.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Egress
