apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deploycanary.name" . }}
  labels:
    {{- include "deploycanary.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "deploycanary.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: nais-api
      ports:
        - port: 3001
          protocol: TCP
        - port: 3006
          protocol: TCP
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
