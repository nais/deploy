apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hookd.name" . }}
  labels:
    {{- include "hookd.labels" . | nindent 4 }}
spec:
  ingressClassName: external-haproxy
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "hookd.name" . }}
                port:
                  number: 80
          - path: /logs
            pathType: Prefix
            backend:
              service:
                name: {{ include "hookd.name" . }}
                port:
                  number: 80
          - path: /events
            pathType: Prefix
            backend:
              service:
                name: {{ include "hookd.name" . }}
                port:
                  number: 80
