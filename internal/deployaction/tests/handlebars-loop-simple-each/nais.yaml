apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50M"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
  name: "myapp"
  namespace: "myteam"
  labels:
    "team": "myteam"
spec:
  image: {{image}}
  port: 3000
  liveness:
    path: "/api/internal/isAlive"
    initialDelay: 20
    timeout: 60
  readiness:
    path: "/api/internal/isReady"
    initialDelay: 20
    timeout: 60
  replicas:
    min: 2
    max: 4
  resources:
    requests:
      cpu: 60m
      memory: 256Mi
    limits:
      memory: 256Mi
  observability:
    tracing:
      enabled: true
  prometheus:
    enabled: true
    path: "/api/internal/metrics"
  envFrom:
    - secret: myapp-env-local
  ingresses:
  {{#each ingresses as |url|}}
    - {{url}}
  {{/each}}
  env:
  {{#each env}}
    - name: {{this.name }}
      value: {{this.value}}
  {{/each}}
  accessPolicy:
    outbound:
      external:
        - host: api.example-cms.io
        - host: abc123.api.example-cms.io
        - host: cdn.example-cms.io
        - host: abc123.cdn.example-cms.io
        - host: assets.example-cms.io
