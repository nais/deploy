name: Nais Deploy
on:
  pull_request:
    paths:
      - "actions/**"
      - "internal/deployaction/**"
      - "internal/githubactions/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/main.yaml"
  push:
    branches:
      - deploy-v3
    paths:
      - "actions/**"
      - "internal/deployaction/**"
      - "internal/githubactions/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/main.yaml"

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        mise-task:
          - build
          - check:deadcode
          - check:gosec
          - check:staticcheck
          - check:vulncheck
          - test
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # ratchet:jdx/mise-action@v5
      - run: mise run ${{ matrix.mise-task }}
  release:
    name: Release GitHub Action
    if: github.ref == 'refs/heads/deploy-v3'
    needs:
      - checks
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # ratchet:jdx/mise-action@v5
      - id: version
        run: echo "tag=$(<actions/deploy/version)" >> "$GITHUB_OUTPUT"
      - run: mise run build
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag -f ${{ steps.version.outputs.tag }}
          git push -f --tags
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # ratchet:softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: bin/deploy-action
          fail_on_unmatched_files: true
