apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: myapp
  namespace: myteam
  labels:
    team: myteam
    systemkatalog.example.com/system: SK-000
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  leaderElection: true
  ingresses:
    - https://myapp.example.com
    - https://myapp.internal.example.com
  replicas:
    max: 2
    min: 1
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 16Mi
  env:
    - name: CONFIG_FILE_PATH
      value: /var/run/configmaps/teams.yaml
    - name: EXTERNAL_ORG
      value: example-org
  filesFrom:
    - configmap: myapp-config
      mountPath: /var/run/configmaps
  envFrom:
    - secret: myapp
  postgres:
    clusterName: myapp
  startup:
    path: /internal/health
    initialDelay: 10
    periodSeconds: 5
  readiness:
    path: /internal/health
  liveness:
    path: /internal/health
