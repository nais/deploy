name: "Nais deploy"
description: "Deploy to a Nais cluster using nais CLI with handlebars templating support"
author: "@nais"

branding:
  color: purple
  icon: zap

runs:
  using: "composite"
  steps:
    - name: Setup nais CLI
      uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # ratchet:nais/setup@v1.0.3
      with:
        team: ${{ env.TEAM || '' }}
        environment: ${{ env.CLUSTER || '' }}

    - name: Template and deploy
      shell: bash
      run: ${{ github.action_path }}/entrypoint.sh
